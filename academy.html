/* ============ COURSE 1 & 2 (psychology — original summaries, no book text) ============ */
const C1={name:"COURSE 01 · THE FOREX MINDSET",sub:"Trading psychology foundations — concepts from J. Martinez",mods:[
{t:"Get Excited About Trading",e:"Goals are fuel. No goal, no engine.",p:["Every trading career starts as a dream — the danger is losing the excitement when the grind starts.","A written goal converts vague hope into direction; most people never set one and drift.","Motivation is renewable: when it fades, re-set or replace the goal rather than quitting."],r:"Write ONE trading goal with a number and a date. Review it every session.",j:"What got you into trading — and is that reason still driving you?"},
{t:"Finding a Mentor",e:"Success is a formula someone already has.",p:["Fastest route to skill: find someone succeeding at what you want, study them, copy their process.","Three steps: get close → study → do what they do.","Without a mentor you pay for the formula in time and losses instead."],r:"Steal process, not trades. Copy routines of proven traders, never their positions.",j:"Who is your trading model right now? If none — who could be?"},
{t:"Greed & Fear Run the Market",e:"Price is crowd emotion with a chart on it.",p:["Greed escalates size until one loss ends the account — it's addictive and always wants more.","Counter-rule: never risk an amount that would change your life if lost.","Fear is the other engine — panic exits and hesitation are its chart signatures."],r:"Size every trade so a full loss changes nothing about your life.",j:"Describe your last greed-sized trade. What did it cost?"},
{t:"Achieving Excellence",e:"Excellence is a habit, not an event.",p:["Winners are made in preparation — the win only reveals work already done.","Adversity doesn't build character at the desk; it reveals it.","Persistence past where others quit is the actual edge most traders lack."],r:"Judge yourself on process followed, never on single-trade outcome.",j:"Last losing streak: did you adjust, or abandon?"},
{t:"Head vs Heart",e:"Think with the left brain, or the right brain trades for you.",p:["Three layers: logical mind (thinks), emotional mind (feels), subconscious (turns repetition into habit).","Smart people make dumb trades because IQ doesn't govern emotion under pressure.","Fix: repeat the logical routine until the subconscious executes it automatically."],r:"Decide entries/exits BEFORE the trade, while the logical mind is in charge.",j:"A trade where you 'knew better' but did it anyway — which mind drove?"},
{t:"Emotional Intelligence",e:"EQ beats IQ at the trading desk.",p:["EQ = positive self-control over damaging emotions while they fire.","Winning feels invincible, losing feels fearful — both distort the next decision.","Traders know the rules and still break them when emotion drives; knowing ≠ governing."],r:"Never place a trade while feeling invincible or desperate — both are impaired states.",j:"After a big win, what does your next trade usually look like?"},
{t:"The Importance of Change",e:"Success sticks to people who already act like it.",p:["Three managed states: poverty (paycheck-to-paycheck), mediocrity (getting by), success (assets on plan).","You don't find success — you become its equivalent, then it finds you.","Changing results requires changing daily habits first."],r:"Change the habit first; the result follows the habit, never the reverse.",j:"Which state are you managing today — and what habit keeps you there?"},
{t:"The Trader's Constitution",e:"Written rules are character under pressure.",p:["A constitution: written laws for your conduct — made calm, obeyed emotional, hard to change.","Obeying your own rules rebuilds personality: discipline practiced becomes character owned.","An EA is a constitution in code — manual trading needs the same document."],r:"If a rule can be broken when tilted, it isn't written clearly enough.",j:"Which of your rules break under emotion — and which emotion?"},
{t:"Dealing with Frustration",e:"Frustration is feedback about process, not identity.",p:["Frustration compounds: spurts → days → a frustrated career, unless the source is fixed.","'No clear strategy' / 'I'll never get this' — each frustrated thought marks a process gap.","When frustrated: stop, name the missing piece, fix that piece, then resume."],r:"Frustrated = flat. No trades until the cause is named and addressed.",j:"Your three most common frustrated thoughts → what gap does each mark?"},
{t:"Dealing with Anger",e:"Anger is fear wearing armor.",p:["Anger is a threat response — chemistry spikes, decision quality collapses.","Revenge trading is anger trading: attacking the market to recover a loss it doesn't know about.","The skill is shortening recovery: feel it, name it, cool down, THEN decide."],r:"Painful loss → mandatory 15+ min cooldown before the next order.",j:"How long does anger hold your wheel at the desk?"},
{t:"Attitude → Results",e:"Thought → belief → action → result.",p:["Every achievement runs the same pipeline: thought hardens into belief, belief drives action.","Attitude is chosen daily like clothes — and compounds into a career.","Average strategy + disciplined optimist beats brilliant strategy + pessimist."],r:"Choose the session's attitude before the charts open.",j:"What belief about yourself is currently driving your trading actions?"},
{t:"Patience & Self-Control",e:"Count down before you blast off.",p:["Patience = capacity to wait for the boring setup and tolerate delay.","Marshmallow study: delayed gratification predicts success — waiting IS the skill.","Temptation at the desk = off-plan trades: chasing, early entries, oversizing after wins."],r:"No setup, no trade. Boredom is a position — usually the best-paying one.",j:"Of your last 10 trades, how many were full-checklist setups?"},
{t:"Listening with Humility",e:"Trade what the chart says, not what you want.",p:["Hearing acknowledges; listening comprehends — most traders 'hear' charts while telling them what to do.","We enter when the chart screams stay out, because ego outvotes observation.","The trader who needs to be right loses to the one who wants to see clearly."],r:"If you're arguing with the chart, it already won. Close or stand aside.",j:"When did you last hold a position the chart had invalidated?"},
{t:"Trade with Confidence",e:"Courage is mastery of fear, not absence.",p:["The Four Fears: losing money · missing out · profit turning into loss · being wrong.","Interrogate fear: what exactly? worst case? MOST PROBABLE case? The monster rarely survives.","Confidence is built from evidence: tested rules, small size, survived losses."],r:"Fear spikes → ask worst case vs probable case. Trade the probable, plan the worst.",j:"Which of the Four Fears costs you the most money?"},
{t:"Protect Yourself at All Times",e:"Blindsides are scheduled. Armor up before.",p:["Bad events are guaranteed; you control the response, never the event.","Layers: capital (stops always), emotions (routines), lifestyle (never trade needed money).","An unprotected position lets the market choose your loss size."],r:"No order without a stop attached. Ever.",j:"Where are you unprotected right now — capital, emotions, or lifestyle?"}],
quiz:{
easy:[[0,"The starting fuel of every trading career is:",["A big account","A goal or dream","A mentor","A system"],1,"Goals create the motivation that powers everything else."],
[1,"The success shortcut is:",["Trial and error","Copying a proven person's process","College","Bigger size"],1,"Find the formula-holder, study them, do what they do."],
[2,"Never risk money that…",["…is borrowed","…would change your life if lost","…is under $1000","…isn't insured"],1,"Losses must be survivable financially AND emotionally."],
[3,"Excellence is:",["Talent","A onetime event","A habit","Luck"],2,"You are what you repeatedly do."],
[4,"The three layers of mind: thinking, feeling, and…",["dreaming","subconscious habit","memory","instinct"],1,"The subconscious turns repetition into automatic habits."],
[5,"Emotional intelligence is:",["High IQ","Self-control over damaging emotions","Never feeling fear","Reading people"],1,"Governing your own destructive emotions while they fire."],
[7,"A trader's constitution is:",["A strategy","Written personal laws","A broker form","A journal"],1,"Rules written calm, obeyed under pressure."],
[9,"Anger is ultimately a form of:",["Greed","Fear","Confidence","Skill"],1,"It's a threat response — fear in disguise."],
[11,"The marshmallow study showed the value of:",["Sugar","Delayed gratification","IQ","Speed"],1,"Waiting for the bigger reward predicted later success."],
[13,"Courage is:",["No fear","Mastery of fear","Ignoring fear","Winning"],1,"Everyone feels fear; courage acts correctly despite it."]],
medium:[[2,"Gold runs $40 your way in minutes. Greed's whisper is:",["Take profit","Add triple size — this is the one","Stop to breakeven","Journal it"],1,"Greed escalates size at the worst moment; pre-set sizing is the counter."],
[5,"5 wins in a row, you feel invincible. Correct move:",["Double size","Trade normally — rules unchanged","Quit while ahead","Withdraw all"],1,"Invincibility is an impaired state; rules stay identical."],
[7,"Constitution says 2 trades/day max. A perfect 3rd appears:",["Take it","Skip — the rule exists for THIS moment","Half size","Rewrite the rule now"],1,"Rules are written calm to be obeyed tempted."],
[9,"Stop slips, rage rises. Best action:",["Re-enter bigger","Walk away 15+ min","Switch pairs","Remove stops"],1,"Cooldown first — anger chemistry ruins the next choice."],
[11,"Three hours, no valid setup:",["Lower the bar","Stay flat — boredom pays","Drop to M1","Coin flip"],1,"Forcing entries converts boredom into losses."],
[12,"Long position; chart breaks support with lower highs. Listening =",["Hold and hope","Exit/reduce — idea invalidated","Average down","Hide the chart"],1,"Trade what price does, not what your position needs."],
[13,"Your +2R runner hits +1R, you panic-close vs plan. Which fear?",["Missing out","Profit turning into loss","Being wrong","Loss"],1,"Cutting winners early caps the payoff ratio your edge needs."],
[8,"Frustrated all week. Correct order:",["Trade more","Stop → name the gap → fix → resume","New strategy daily","Blame conditions"],1,"Frustration marks a specific gap; fix the gap, not the symptom."],
[3,"4 losses that all followed rules:",["Change system now","Keep executing — judge over a big sample","Double size","Drop stops"],1,"Rule-following losses are tuition, not failure."],
[14,"EA had no stop during news (bug). Lesson:",["EAs unsafe","Verify protection BEFORE events, every position","News is unfair","Smaller size"],1,"Protection is checked proactively — after the blindside is too late."]],
hard:[[13,"FundedNext eval, day 3, −2%. B-grade setup appears:",["Take it — evals need aggression","Skip: eval pressure is fear dressed as logic","Half size compromise","Quit"],1,"Pressure reframes mediocre setups as 'necessary' — name the fear, don't obey it."],
[2,"Backtest: PF 1.41 but one spike nearly zeroed the account:",["Ship it","Size so the worst historical event survives, then judge edge","Delete that month","Trade Feb only"],1,"Edge means nothing if one tail event ends the account."],
[7,"Your EA never breaks rules; you override it in drawdowns. You have:",["Two systems and no constitution","A hybrid edge","Better control","A hedge"],0,"Overrides ARE rule-breaks; the constitution must govern the operator."],
[9,"Revenge trade after a slip WINS big. Constitutional response:",["Winning validates it","Log a violation — profitable rule-breaks teach the worst lessons","Raise size","Delete the log"],1,"It trains the subconscious to break rules — the most expensive win."],
[4,"Why does moving your checklist INTO an EA work psychologically?",["Computers are smarter","Execution leaves the feeling mind — code can't feel the Four Fears","Speed only","No rules needed"],1,"Automation is engineered discipline."],
[13,"Rank the Four Fears by damage to a BREAKOUT trader:",["FOMO > loss > wrong > profit-loss","Profit-loss > wrong > loss > FOMO","All equal","Loss > FOMO > wrong > profit-loss"],1,"Breakout math needs runners: cutting winners destroys the payoff ratio the edge depends on."],
[12,"Your breakout system bled 8 weeks in chop. Humility at SYSTEM level:",["Abandon breakouts","Read the regime evidence — gate or pause; the market says 'not now'","Force more trades","Blame the broker"],1,"Charts talk at strategy level too; evidence outranks attachment."],
[6,"4 strategies automated, but you interfere compulsively. What matters?",["Better strategies","Changing the operator — the old identity still manages the system","More screens","Faster VPS"],1,"Systems inherit the operator's psychology through interference."],
[0,"A viral flip-bot clip tempts you to rebuild everything. Goal-discipline:",["Rebuild — innovate","Sandbox it as a small experiment; the goal keeps the pipeline","Ignore all new ideas","All-in"],1,"Goals filter opportunities: new ideas get sandboxed, not the driver's seat."],
[10,"'Market took my money' vs 'my process leaked money' predicts:",["Nothing","Everything: ownership produces fixes, blame produces repeats","First is more accurate","Neither with an EA"],1,"Ownership converts losses into process improvements."]]},

["Anger is really…","Fear in disguise — threat response that wrecks decisions",9],

const C2={name:"COURSE 02 · TRADING IN THE ZONE",sub:"Probabilistic mindset — concepts from M. Douglas",mods:[
{t:"Anything Can Happen",e:"The market is other people's beliefs in motion.",p:["Any single trade can lose no matter how perfect the setup — one large trader elsewhere can move price against you.","Because anything can happen, certainty about one trade is always an illusion.","Releasing per-trade expectation is what lets you follow rules calmly."],r:"Never bet certainty on one trade. Certainty lives only in the sample.",j:"Recall a 'sure thing' trade that lost. What did you tell yourself before it?"},
{t:"Think in Probabilities",e:"Trade like the casino, not the gambler.",p:["An edge is only a higher probability of one outcome over many trials — nothing more.","The casino doesn't fear one blackjack loss; it trusts the math across thousands of hands.","Single outcomes are random; series are predictable. Your job is running the series."],r:"Judge every decision over a 20+ trade sample, never over one result.",j:"Do you emotionally treat each trade as the verdict on your system?"},
{t:"Random Distribution",e:"You can't know WHICH trade in the series pays.",p:["Within a real edge, wins and losses arrive in random order — streaks mean nothing about the next trade.","Skipping signals after losses breaks the sample your edge needs to pay you.","Consistency of execution is the only thing that converts an edge into money."],r:"Take every valid signal. Cherry-picking after losses destroys the math.",j:"After 3 losses, do you take the 4th valid signal at full size?"},
{t:"The Five Truths",e:"The probabilistic creed.",p:["1) Anything can happen. 2) You don't need to know what happens next to make money.","3) Wins and losses distribute randomly within an edge. 4) An edge is just a probability tilt.","5) Every market moment is unique — this setup is not that setup, no matter the resemblance."],r:"Read the Five Truths before each session until they're reflexes.",j:"Which truth do you resist the most, and how does it show in your trades?"},
{t:"Full Responsibility",e:"The market owes you nothing.",p:["The market produces neutral information; you assign the meaning and produce the results.","Blaming the market, broker, or news hands away the only thing you control: your framework.","Full responsibility is power: if you caused it, you can fix it."],r:"Every loss gets one question: what part of MY framework produced this?",j:"What's your favorite external blame — and what does it protect you from fixing?"},
{t:"Define & Accept Risk",e:"Accepted risk cannot hurt you into errors.",p:["Define the exact loss before entry — price AND money — then genuinely accept it as spent.","Unaccepted risk turns normal price movement into threat, and threat produces fear errors.","If the potential loss still bothers you, the size is wrong or the acceptance is fake."],r:"Before entry: 'This trade costs $X if wrong, and that's fine.' If it isn't fine — resize.",j:"On your last stop-out, was the loss already accepted, or did it shock you?"},
{t:"The Carefree State",e:"Objective, open, no hesitation.",p:["The goal state: monitoring the market without fear or euphoria — nothing to prove, protect, or avenge.","Hesitation and overtrading are both symptoms of unaccepted risk, not information problems.","Consistency is a state of mind you bring to any market — not something a market gives you."],r:"Hesitating on valid signals? Overtrading? Diagnose risk-acceptance, not the strategy.",j:"Describe your mental state during your best trading week. What made it carefree?"},
{t:"Mechanical → Intuitive",e:"Master the mechanical stage first.",p:["Development stages: mechanical (fixed rules, build the sample), then subjective, then intuitive.","The mechanical stage exists to build consistency and self-trust — most traders skip it and stay random.","Your EAs are the mechanical stage industrialized: rules executing without negotiation."],r:"Earn discretion. No rule-bending until 100+ trades of pure mechanical execution.",j:"Which stage are you honestly in — and are you acting like it?"}],

const C3={name:"COURSE 03 · PRICE ACTION",sub:"Structure, levels, breakouts, sweeps — with REAL chart drills (gold & NQ)",mods:[
{t:"Market Structure",e:"Trend = a staircase you can point at.",p:["Uptrend: higher highs AND higher lows. Downtrend: lower highs AND lower lows. Anything else is a range.","A break of the last swing low in an uptrend (or high in a downtrend) is a break of structure — the first objective warning the trend is changing.","Structure is the skeleton; every other tool (levels, candles, patterns) hangs on it."],r:"Before ANY trade: mark the last swing high and swing low. If you can't, you have no trade.",j:"Pull up your last loss — was structure actually in your direction?"},
{t:"Support & Resistance",e:"Levels are where orders pooled — memory in the market.",p:["S/R levels are zones, not lines — mark the area where price reacted repeatedly, not one exact price.","Old highs/lows attract price because stops and pending orders pool beyond them (liquidity).","A broken resistance often flips to support (and vice versa) — the retest of a flip level is a classic entry."],r:"Draw levels on H4/D1, execute on lower timeframes. Levels from your entry TF are noise.",j:"How many levels are on your chart right now? If >6, which 3 actually matter?"},
{t:"Candles Tell Stories",e:"Wick = rejection. Body = conviction.",p:["A long wick into a level means one side tried and got smacked — rejection. A big body means one side is in control — conviction.","The confirmation candle: after price reaches your zone, wait for a candle that CLOSES in your direction with a rejection wick — that's the market agreeing with you.","Pattern names (pin bar, engulfing) matter less than location: the same candle at a random spot means nothing, at a key level it's a signal."],r:"Closed candles only. The candle isn't saying anything until it closes.",j:"Do you enter on forming candles? What has that cost you?"},
{t:"Ranges & Breakouts",e:"Compression precedes expansion.",p:["Markets breathe: quiet compression (range) → violent expansion (breakout) → back to quiet. The range IS the setup.","The breakout play: tight range, a candle CLOSES outside it, enter with the break — stop on the far side of the range.","Most breakouts that fail were never confirmed: a wick poking out is not a breakout; a CLOSE outside is."],r:"No close outside the range = no breakout = no trade.",j:"Your Breakout EA trades exactly this. Can you spot its setup by eye before it fires?"},
{t:"Pullbacks & Trend Entries",e:"The trend pays — but shallow pullbacks lie.",p:["Trend continuation: impulse → pullback → next impulse. The entry is where the pullback ends, at structure or a level.","Danger: shallow pullbacks in a hot market either don't reach your level or run you over — demand real structure (2+ bars against trend, into a zone).","Confirmation beats prediction: let the pullback END (confirmation candle) instead of catching it mid-fall."],r:"Pullback entry needs THREE things: trend structure + a level + a confirmation candle. Two out of three is a pass.",j:"Your Onion EA lost with shallow pullbacks. What was missing per this lesson?"},
{t:"Liquidity Sweeps",e:"Stops pool beyond obvious levels — and price hunts them.",p:["Beyond every obvious high/low sit clusters of stops. Price often spikes through, fills the big players, and reverses — the sweep.","Sweep-and-reclaim: price runs the level, FAILS to hold beyond it, and closes back — that failure is the signal; enter on the reclaim.","An obvious level that everyone sees usually gets swept before the real move — expect the fake before the break."],r:"When price breaks an obvious level, first ask: sweep or real? The close tells you.",j:"Your NQ sweep-reclaim long — write down the exact sequence you traded."},
{t:"Chart Patterns Decoded",e:"Patterns are structure + liquidity wearing costumes.",p:["Head & shoulders = a failed higher high plus a break of structure. Double top = a swept high that failed twice.","Flags/pennants = pullbacks in an impulse. Triangles = compression (a range that's tilting).","Trade the structure the pattern reveals, not the pattern's name — names don't move price, orders do."],r:"For any pattern, translate it: where's the structure break, where's the trapped liquidity?",j:"Take one textbook pattern and rewrite it in structure+liquidity language."},
{t:"Stops & Targets",e:"Stop where the idea dies. Target where the opposing orders live.",p:["The stop goes where the trade idea is INVALID (beyond the swept low, outside the range) — never at a round dollar amount you're 'comfortable' losing.","Targets belong at opposing liquidity: the next level, the prior high/low — where the market is likely to pause or turn.","Think in R-multiples: risk 1R, structure the exit for 2R+ — partial at 1R with a runner is a robust default (your EAs' exact exit)."],r:"If you can't say WHERE the idea is invalid, you don't have an idea — you have a hope.",j:"On your last 5 trades, was each stop at invalidation or at a comfort number?"}],

[0,"H4 uptrend, M15 downtrend. You want to long an M15 level. Frame it:",["Conflict — never trade","M15 counter-move into an H4 level is exactly how continuation entries form — but the M15 must confirm first","Long anywhere, H4 wins","Short — M15 wins"],1,"Higher TF gives direction; lower TF gives the entry — after confirmation."],
[7,"Two trades, same entry: A) stop below the swept low (8pts), B) stop at 'comfortable' 20pts. Same target. The REAL difference:",["B is safer","A risks less per unit AND sits at invalidation; B pays extra for comfort and still dies if the idea fails","Identical expectancy","B has better win rate so it's better"],1,"Comfort-stops cost R-multiple without adding protection where it matters."],

function drawChart(cv,candles,fut){
 const ctx=cv.getContext('2d');const W=cv.width=680,H=cv.height=360;
 ctx.fillStyle='#0d110d';ctx.fillRect(0,0,W,H);
 const all=fut?candles.concat(fut):candles;
 let mn=1e18,mx=-1e18;all.forEach(c=>{mn=Math.min(mn,c[2]);mx=Math.max(mx,c[1])});
 const pad=(mx-mn)*0.06;mn-=pad;mx+=pad;
 const N=candles.length+(fut?fut.length:8);
 const cw=W/(N+2),bw=Math.max(2,cw*0.6);
 const y=p=>H-(p-mn)/(mx-mn)*H;
 ctx.strokeStyle='#1a221a';ctx.lineWidth=1;
 for(let g=1;g<5;g++){ctx.beginPath();ctx.moveTo(0,H*g/5);ctx.lineTo(W,H*g/5);ctx.stroke()}
 function candle(c,i,dim){
  const x=cw*(i+1);const up=c[3]>=c[0];
  ctx.strokeStyle=ctx.fillStyle=dim?(up?'rgba(57,211,83,.45)':'rgba(229,72,77,.45)'):(up?'#39d353':'#e5484d');
  ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y(c[1]));ctx.lineTo(x,y(c[2]));ctx.stroke();
  const t=y(Math.max(c[0],c[3])),b=y(Math.min(c[0],c[3]));
  ctx.fillRect(x-bw/2,t,bw,Math.max(2,b-t));}
 candles.forEach((c,i)=>candle(c,i,false));
 if(fut){fut.forEach((c,i)=>candle(c,candles.length+i,true));
  const x=cw*(candles.length+.5);ctx.strokeStyle='#ffc800';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);}
 else{const x=cw*(candles.length+.5);ctx.strokeStyle='#ffc800';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#ffc800';ctx.font='12px sans-serif';ctx.fillText('YOU ARE HERE',Math.min(x+6,W-100),16);}}
